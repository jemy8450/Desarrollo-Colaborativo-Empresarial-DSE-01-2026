<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>CRUD Productos con Stock</title>
  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- SweetAlert2 -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Barra de menú con Tabs -->
  <ul class="nav nav-tabs mb-4" id="menuTabs" role="tablist">
    <li class="nav-item" role="presentation">
      <button class="nav-link active" id="crear-tab" data-bs-toggle="tab" data-bs-target="#crear" type="button" role="tab">Crear Producto</button>
    </li>
    <li class="nav-item" role="presentation">
      <button class="nav-link" id="lista-tab" data-bs-toggle="tab" data-bs-target="#lista" type="button" role="tab">Lista de Productos</button>
    </li>
  </ul>

  <!-- Contenido de Tabs -->
  <div class="tab-content container">
    <!-- Sección Crear -->
    <div class="tab-pane fade show active" id="crear" role="tabpanel">
      <h2>Crear Producto</h2>
      <form id="productForm" class="row g-3">
        <input type="hidden" id="productId">
        <div class="col-md-6">
          <input type="text" id="name" class="form-control" placeholder="Nombre del producto" required>
        </div>
        <div class="col-md-6">
          <input type="number" id="price" class="form-control" placeholder="Precio (máx. 7 cifras)" step="0.01" min="0" required>
        </div>
        <div class="col-md-6">
          <input type="number" id="stock" class="form-control" placeholder="Stock (solo enteros)" min="0" required>
        </div>
        <div class="col-md-6">
          <select id="categoria" class="form-select" required>
            <option value="">Seleccione categoría</option>
            <option value="Electrónica">Electrónica</option>
            <option value="Ropa">Ropa</option>
            <option value="Hogar">Hogar</option>
          </select>
        </div>
        <div class="col-12">
          <textarea id="descripcion" class="form-control" placeholder="Descripción del producto" required></textarea>
        </div>
        <div class="col-12">
          <button type="submit" class="btn btn-success">Guardar Producto</button>
        </div>
      </form>
    </div>

    <!-- Sección Lista -->
    <div class="tab-pane fade" id="lista" role="tabpanel">
      <h2>Lista de Productos</h2>

      <!-- Buscador y filtro -->
      <div class="row mb-3">
        <div class="col-md-6">
          <input type="text" id="searchInput" class="form-control" placeholder="Buscar por nombre...">
        </div>
        <div class="col-md-6">
          <select id="filterCategoria" class="form-select">
            <option value="">Todas las categorías</option>
            <option value="Electrónica">Electrónica</option>
            <option value="Ropa">Ropa</option>
            <option value="Hogar">Hogar</option>
          </select>
        </div>
      </div>

      <table class="table table-striped table-bordered">
        <thead class="table-dark">
          <tr>
            <th>#</th>
            <th>Nombre</th>
            <th>Precio</th>
            <th>Stock</th>
            <th>Estado</th>
            <th>Categoría</th>
            <th>Descripción</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="productList"></tbody>
      </table>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
